services:
  db:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:local-development-only@db/crm
    volumes:
      - ./data:/data:ro

volumes:
  postgres-data:
